<div class="home">
  <h1 class="home_title">My habits</h1>
  <div class="home_habitssection">
    <app-habit-form
    (habitCreated)="addHabit($event)"
    ></app-habit-form>
    <app-habit-statistics
      [habits]="habits()"
      [maxStreak]="maxStreak()"
    ></app-habit-statistics>

    <div class="streak">

      />

      <div class="streak__info">
        <span class="streak__count">
          {{ maxStreak() }}
        </span>

        <span class="streak__text">
          max day streak
        </span>
      </div>
    </div> -->
  </div>

  <div class="home_statisticsection">
        <app-habit-activity
      [habits]="habits()"
    ></app-habit-activity>

  </div>

   <div class="home_list">
      @for (habit of habits(); track habit.id) {
        <app-habit-card 
          [habit]="habit" 
          (toggleCompleted)="toggleHabit($event)" 
          (deleteHabit)="deleteHabit($event)"
        ></app-habit-card>
      } @empty {
        <p>No habits yet</p>
      }
    </div>
</div>
