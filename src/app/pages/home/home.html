   <div class="home_list">
    <app-ui-card>
      <div class="home__list-header">
        <h2 class="home__list-title">
          Active Habits
        </h2>

        <span class="home__list-count">
          {{ activeHabits().length }} Active
        </span>
      </div>

    <div class="home__list-items">
        @for (habit of activeHabits(); track habit.id) {
          <app-habit-card
            [habit]="habit"
            (toggleCompleted)="toggleHabit($event)"
            (deleteHabit)="deleteHabit($event)"
            (editHabit)="openEditHabit($event)"
            (archiveHabit)="archiveHabit($event)"
          />
        } @empty {
          <p class="home__list-empty">
            No active habits yet. Create your first habit!
          </p>
        }
      </div>
    </app-ui-card>
  </div>

@if (archivedHabits().length > 0) {
  <div class="home__archive">
    <app-ui-card>
      <app-archived-habits
        [habits]="archivedHabits()"
        (restoreHabit)="restoreHabit($event)"
      />
    </app-ui-card>
  </div>
}
@if (isAddModalOpen() || editingHabit()) {
  <app-habit-modal
    [habit]="editingHabit()"
    (saved)="saveHabitFromModal($event)"
    (closed)="closeHabitModal()"
  />
}
