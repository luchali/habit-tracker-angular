<div class="home">
  <app-section-heading
  class="home_title"
  title="My Habits"
  subtitle="Build better habits, one day at a time."
/>
  <div class="home_habitssection">
    <app-ui-card>
      <app-habit-form
        (habitCreated)="addHabit($event)"
      ></app-habit-form>
    </app-ui-card>

    <app-ui-card>
    <app-habit-statistics
      [habits]="habits()"
      [maxStreak]="maxStreak()"
    ></app-habit-statistics>
    </app-ui-card>

<!-- 
    <div class="streak">
      <img
        class="streak__fire"
        src="fire-streak.gif"
        alt="Fire streak"
      />

      <div class="streak__info">
        <span class="streak__count">
          {{ maxStreak() }}
        </span>

        <span class="streak__text">
          max day streak
        </span>
      </div>
    </div> -->
  </div>

  <div class="home_statisticsection">
    <app-ui-card>
    <app-habit-activity
      [habits]="habits()"
    ></app-habit-activity>
    </app-ui-card>

  </div>

   <div class="home_list">
    <app-ui-card>
      @for (habit of habits(); track habit.id) {
        <app-habit-card 
          [habit]="habit" 
          (toggleCompleted)="toggleHabit($event)" 
          (deleteHabit)="deleteHabit($event)"
        ></app-habit-card>
      } @empty {
        <p>No habits yet</p>
      }
    </app-ui-card>   
   </div>
</div>
